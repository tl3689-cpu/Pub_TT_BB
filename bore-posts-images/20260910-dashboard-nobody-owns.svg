<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<title>Before the dashboard: 4 things every number needs</title>
<style>text{font-family:Arial,Helvetica,"Liberation Sans",sans-serif}</style>
<rect x="0" y="0" width="1080" height="1350" fill="#F6F2E8"/>
<rect x="0" y="0" width="1080" height="14" fill="#B8741A"/>
<text x="72" y="92" font-size="22" font-weight="bold" fill="#B8741A">FRAGILITY AS COMMERCIAL RISK</text>
<text x="72" y="150" font-size="60" font-weight="bold" fill="#14302A">Before the dashboard: 4 things</text>
<text x="72" y="217.2" font-size="60" font-weight="bold" fill="#14302A">every number needs</text>
<text x="72" y="290.4" font-size="28" fill="#4A5A55">Do this for your five most important numbers.</text>
<rect x="72" y="354.7" width="456" height="340" rx="20" fill="#FFFFFF" stroke="#D8D2BF" stroke-width="2"/>
<circle cx="120" cy="406.7" r="30" fill="#10705A"/>
<text x="120" y="418.7" font-size="32" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="166" y="418.7" font-size="32" font-weight="bold" fill="#14302A">Single source</text>
<text x="98" y="474.7" font-size="26" fill="#4A5A55">One system creates the number.</text>
<text x="98" y="508.5" font-size="26" fill="#4A5A55">Nobody copies it between sheets.</text>
<rect x="92" y="616.8" width="416" height="58" rx="12" fill="#E1EEE8"/>
<text x="106" y="654.8" font-size="22" font-weight="bold" fill="#10705A">Where is it born?</text>
<rect x="552" y="354.7" width="456" height="340" rx="20" fill="#FFFFFF" stroke="#D8D2BF" stroke-width="2"/>
<circle cx="600" cy="406.7" r="30" fill="#10705A"/>
<text x="600" y="418.7" font-size="32" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="646" y="418.7" font-size="32" font-weight="bold" fill="#14302A">Named owner</text>
<text x="578" y="474.7" font-size="26" fill="#4A5A55">One person answers for it being</text>
<text x="578" y="508.5" font-size="26" fill="#4A5A55">right when the board asks.</text>
<rect x="572" y="616.8" width="416" height="58" rx="12" fill="#E1EEE8"/>
<text x="586" y="654.8" font-size="22" font-weight="bold" fill="#10705A">Who owns it?</text>
<rect x="72" y="714.8" width="456" height="340" rx="20" fill="#FFFFFF" stroke="#D8D2BF" stroke-width="2"/>
<circle cx="120" cy="766.8" r="30" fill="#10705A"/>
<text x="120" y="778.8" font-size="32" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="166" y="778.8" font-size="32" font-weight="bold" fill="#14302A">Written definition</text>
<text x="98" y="834.8" font-size="26" fill="#4A5A55">What counts, what does not, and</text>
<text x="98" y="868.5" font-size="26" fill="#4A5A55">from when.</text>
<rect x="92" y="976.8" width="416" height="58" rx="12" fill="#E1EEE8"/>
<text x="106" y="1014.8" font-size="22" font-weight="bold" fill="#10705A">What does it mean?</text>
<rect x="552" y="714.8" width="456" height="340" rx="20" fill="#FFFFFF" stroke="#D8D2BF" stroke-width="2"/>
<circle cx="600" cy="766.8" r="30" fill="#10705A"/>
<text x="600" y="778.8" font-size="32" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="646" y="778.8" font-size="32" font-weight="bold" fill="#14302A">A decision</text>
<text x="578" y="834.8" font-size="26" fill="#4A5A55">If no decision depends on it, retire</text>
<text x="578" y="868.5" font-size="26" fill="#4A5A55">the number.</text>
<rect x="572" y="976.8" width="416" height="58" rx="12" fill="#E1EEE8"/>
<text x="586" y="1014.8" font-size="22" font-weight="bold" fill="#10705A">What does it drive?</text>
<rect x="72" y="1078.8" width="936" height="76.4" rx="18" fill="#EBE3D0"/>
<text x="102" y="1118.8" font-size="28" font-weight="bold" fill="#14302A">Owned, defined and used. That is where control starts.</text>
<rect x="0" y="1230" width="1080" height="120" fill="#FFFFFF"/>
<polygon points="129.9,1277.8 129.9,1282.2 123.2,1285.1 122.2,1288.4 125.9,1294.6 123.3,1298.2 116.2,1296.6 113.4,1298.6 112.7,1305.9 108.5,1307.2 103.7,1301.8 100.3,1301.8 95.5,1307.2 91.3,1305.9 90.6,1298.6 87.8,1296.6 80.7,1298.2 78.1,1294.6 81.8,1288.4 80.8,1285.1 74.1,1282.2 74.1,1277.8 80.8,1274.9 81.8,1271.6 78.1,1265.4 80.7,1261.8 87.8,1263.4 90.6,1261.4 91.3,1254.1 95.5,1252.8 100.3,1258.2 103.7,1258.2 108.5,1252.8 112.7,1254.1 113.4,1261.4 116.2,1263.4 123.3,1261.8 125.9,1265.4 122.2,1271.6 123.2,1274.9" fill="#10705A"/>
<circle cx="102" cy="1280" r="11.7" fill="#F6F2E8"/>
<text x="146" y="1272" font-size="30" font-weight="bold" fill="#14302A">Tony Taslim</text>
<text x="146" y="1304" font-size="22" fill="#4A5A55">Efficient Business Solutions</text>
<text x="1008" y="1326" font-size="20" fill="#B8741A" text-anchor="end" font-style="italic">Enterprise structure, translated.</text>
</svg>
