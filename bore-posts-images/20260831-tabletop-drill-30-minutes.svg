<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1028.5 1285.7">
<title>The 30-minute recovery drill</title>
<style>text{font-family:Arial,Helvetica,"Liberation Sans",sans-serif}</style>
<rect x="0" y="0" width="1028.5" height="1285.7" fill="#F6F2E8"/>
<rect x="0" y="0" width="1028.5" height="14" fill="#B8741A"/>
<text x="68.5" y="92" font-size="22" font-weight="bold" fill="#B8741A">RESILIENCE OVER GROWTH</text>
<text x="68.5" y="150" font-size="60" font-weight="bold" fill="#14302A">The 30-minute recovery drill</text>
<text x="68.5" y="223.2" font-size="28" fill="#4A5A55">Scenario: your main system is down from 9am tomorrow.</text>
<line x1="128.5" y1="301.5" x2="128.5" y2="1011.5" stroke="#10705A" stroke-width="5"/>
<circle cx="128.5" cy="331.5" r="34" fill="#10705A"/>
<text x="128.5" y="341.5" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">0-5</text>
<text x="198.5" y="327.5" font-size="34" font-weight="bold" fill="#14302A">Write, don't talk</text>
<text x="198.5" y="365.5" font-size="27" fill="#4A5A55">Each person lists who they would call first.</text>
<circle cx="128.5" cy="481.5" r="34" fill="#10705A"/>
<text x="128.5" y="491.5" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5-10</text>
<text x="198.5" y="477.5" font-size="34" font-weight="bold" fill="#14302A">Compare the pictures</text>
<text x="198.5" y="515.5" font-size="27" fill="#4A5A55">Different names on the page is finding number one.</text>
<circle cx="128.5" cy="631.5" r="34" fill="#10705A"/>
<text x="128.5" y="641.5" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">10-20</text>
<text x="198.5" y="627.5" font-size="34" font-weight="bold" fill="#14302A">Walk the first hour</text>
<text x="198.5" y="665.5" font-size="27" fill="#4A5A55">Who decides, who tells clients, who keeps the books moving?</text>
<circle cx="128.5" cy="781.5" r="34" fill="#10705A"/>
<text x="128.5" y="791.5" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">20-25</text>
<text x="198.5" y="777.5" font-size="34" font-weight="bold" fill="#14302A">List what stops</text>
<text x="198.5" y="815.5" font-size="27" fill="#4A5A55">What you could not do, and for how many hours.</text>
<circle cx="128.5" cy="931.5" r="34" fill="#10705A"/>
<text x="128.5" y="941.5" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">25-30</text>
<text x="198.5" y="927.5" font-size="34" font-weight="bold" fill="#14302A">Pick one gap</text>
<text x="198.5" y="965.5" font-size="27" fill="#4A5A55">One owner, one date. Fix nothing in the room.</text>
<rect x="68.5" y="1045.6" width="891.4" height="76.4" rx="18" fill="#E1EEE8"/>
<text x="98.5" y="1085.6" font-size="28" font-weight="bold" fill="#10705A">Run it each quarter and the answers start to match.</text>
<rect x="0" y="1165.7" width="1028.5" height="120" fill="#FFFFFF"/>
<polygon points="126.5,1213.5 126.5,1217.9 119.8,1220.8 118.7,1224.1 122.4,1230.3 119.9,1233.9 112.8,1232.3 110,1234.3 109.3,1241.6 105.1,1242.9 100.3,1237.5 96.9,1237.5 92,1242.9 87.9,1241.6 87.2,1234.3 84.4,1232.3 77.3,1233.9 74.7,1230.3 78.4,1224.1 77.3,1220.8 70.7,1217.9 70.7,1213.5 77.3,1210.6 78.4,1207.4 74.7,1201.1 77.3,1197.5 84.4,1199.1 87.2,1197.1 87.9,1189.8 92,1188.5 96.9,1193.9 100.3,1193.9 105.1,1188.5 109.3,1189.8 110,1197.1 112.8,1199.1 119.9,1197.5 122.4,1201.1 118.7,1207.4 119.8,1210.6" fill="#10705A"/>
<circle cx="98.5" cy="1215.7" r="11.7" fill="#F6F2E8"/>
<text x="142.5" y="1207.7" font-size="30" font-weight="bold" fill="#14302A">Tony Taslim</text>
<text x="142.5" y="1239.7" font-size="22" fill="#4A5A55">Efficient Business Solutions</text>
<text x="959.9" y="1261.7" font-size="20" fill="#B8741A" text-anchor="end" font-style="italic">Enterprise structure, translated.</text>
</svg>
