<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1028.5 1285.7">
<title>The 90th minute</title>
<style>text{font-family:Arial,Helvetica,"Liberation Sans",sans-serif}</style>
<rect x="0" y="0" width="1028.5" height="1285.7" fill="#F6F2E8"/>
<rect x="0" y="0" width="1028.5" height="14" fill="#B8741A"/>
<text x="68.5" y="92" font-size="22" font-weight="bold" fill="#B8741A">RESILIENCE OVER GROWTH</text>
<text x="68.5" y="150" font-size="60" font-weight="bold" fill="#14302A">The 90th minute</text>
<text x="68.5" y="223.2" font-size="28" fill="#4A5A55">What Fergie Time taught me about structure.</text>
<rect x="68.5" y="287.5" width="891.4" height="290" rx="20" fill="#1F6B4A"/>
<line x1="88.5" y1="441.5" x2="939.9" y2="441.5" stroke="#CFE8D8" stroke-width="3"/>
<circle cx="88.5" cy="441.5" r="12" fill="#FFFFFF"/>
<text x="88.5" y="501.5" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle">0'</text>
<circle cx="500.5" cy="441.5" r="12" fill="#FFFFFF"/>
<text x="500.5" y="501.5" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle">45'</text>
<circle cx="912.5" cy="441.5" r="12" fill="#FFFFFF"/>
<text x="912.5" y="501.5" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle">90'</text>
<circle cx="912.5" cy="441.5" r="22" fill="#B8741A"/>
<text x="98.5" y="351.5" font-size="28" font-weight="bold" fill="#FFFFFF">Behind on the scoreboard</text>
<text x="929.9" y="351.5" font-size="28" font-weight="bold" fill="#F3DDB4" text-anchor="end">Fergie Time</text>
<text x="514.2" y="549.5" font-size="30" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Refusing to accept the scoreboard</text>
<rect x="68.5" y="597.5" width="891.4" height="103.8" rx="16" fill="#FFFFFF" stroke="#D8D2BF" stroke-width="2"/>
<rect x="68.5" y="597.5" width="14" height="103.8" rx="8" fill="#4A5A55"/>
<text x="108.5" y="643.5" font-size="32" font-weight="bold" fill="#14302A">Good leadership</text>
<text x="108.5" y="681.5" font-size="26" fill="#4A5A55">Turns a mediocre performance into a win.</text>
<rect x="68.5" y="715.3" width="891.4" height="137.6" rx="16" fill="#FFFFFF" stroke="#D8D2BF" stroke-width="2"/>
<rect x="68.5" y="715.3" width="14" height="137.6" rx="8" fill="#10705A"/>
<text x="108.5" y="761.3" font-size="32" font-weight="bold" fill="#14302A">Great leadership</text>
<text x="108.5" y="799.3" font-size="26" fill="#4A5A55">Builds systems that keep winning while the leader is in charge.</text>
<rect x="68.5" y="866.9" width="891.4" height="103.8" rx="16" fill="#FFFFFF" stroke="#D8D2BF" stroke-width="2"/>
<rect x="68.5" y="866.9" width="14" height="103.8" rx="8" fill="#B8741A"/>
<text x="108.5" y="912.9" font-size="32" font-weight="bold" fill="#14302A">The greatest leader</text>
<text x="108.5" y="950.9" font-size="26" fill="#4A5A55">Leaves a winning legacy that passes through generations.</text>
<rect x="68.5" y="988.8" width="891.4" height="76.4" rx="18" fill="#E1EEE8"/>
<text x="98.5" y="1028.8" font-size="28" font-weight="bold" fill="#10705A">People, process and technology, working as one.</text>
<rect x="0" y="1165.7" width="1028.5" height="120" fill="#FFFFFF"/>
