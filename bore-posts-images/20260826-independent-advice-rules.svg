<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1028.5 1285.7">
<title>5 rules for advice you can trust</title>
<style>text{font-family:Arial,Helvetica,"Liberation Sans",sans-serif}</style>
<rect x="0" y="0" width="1028.5" height="1285.7" fill="#F6F2E8"/>
<rect x="0" y="0" width="1028.5" height="14" fill="#B8741A"/>
<text x="68.5" y="92" font-size="22" font-weight="bold" fill="#B8741A">THE ENTERPRISE ARCHITECT GAP</text>
<text x="68.5" y="150" font-size="60" font-weight="bold" fill="#14302A">5 rules for advice you can trust</text>
<text x="68.5" y="223.2" font-size="28" fill="#4A5A55">How I keep recommendations independent of any brand.</text>
<rect x="68.5" y="287.5" width="891.4" height="122.6" rx="18" fill="#FFFFFF" stroke="#D8D2BF" stroke-width="2"/>
<circle cx="120.5" cy="348.9" r="30" fill="#10705A"/>
<text x="120.5" y="360.9" font-size="34" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="180.5" y="345.5" font-size="34" font-weight="bold" fill="#14302A">Read first</text>
<text x="180.5" y="382.9" font-size="26" fill="#4A5A55">People, process and technology before any product name.</text>
<rect x="68.5" y="424.1" width="891.4" height="122.6" rx="18" fill="#FFFFFF" stroke="#D8D2BF" stroke-width="2"/>
<circle cx="120.5" cy="485.4" r="30" fill="#10705A"/>
<text x="120.5" y="497.4" font-size="34" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="180.5" y="482.1" font-size="34" font-weight="bold" fill="#14302A">Write the need</text>
<text x="180.5" y="519.5" font-size="26" fill="#4A5A55">What the system must do, in plain business words.</text>
<rect x="68.5" y="560.8" width="891.4" height="122.6" rx="18" fill="#FFFFFF" stroke="#D8D2BF" stroke-width="2"/>
<circle cx="120.5" cy="622" r="30" fill="#10705A"/>
<text x="120.5" y="634" font-size="34" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="180.5" y="618.8" font-size="34" font-weight="bold" fill="#14302A">Compare side by side</text>
<text x="180.5" y="656.1" font-size="26" fill="#4A5A55">Open-source, subscription and commercial, on fit and ROI.</text>
<rect x="68.5" y="697.4" width="891.4" height="122.6" rx="18" fill="#FFFFFF" stroke="#D8D2BF" stroke-width="2"/>
<circle cx="120.5" cy="758.6" r="30" fill="#10705A"/>
<text x="120.5" y="770.6" font-size="34" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="180.5" y="755.4" font-size="34" font-weight="bold" fill="#14302A">Check what you own</text>
<text x="180.5" y="792.8" font-size="26" fill="#4A5A55">Use what is already paid for before buying new.</text>
<rect x="68.5" y="834" width="891.4" height="122.6" rx="18" fill="#FFFFFF" stroke="#D8D2BF" stroke-width="2"/>
<circle cx="120.5" cy="895.3" r="30" fill="#10705A"/>
<text x="120.5" y="907.3" font-size="34" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="180.5" y="892" font-size="34" font-weight="bold" fill="#14302A">Make it repeatable</text>
<text x="180.5" y="929.4" font-size="26" fill="#4A5A55">A non-technical board member can explain the result.</text>
<rect x="0" y="1005.7" width="1028.5" height="124" fill="#10705A"/>
<text x="68.5" y="1061.7" font-size="34" font-weight="bold" fill="#FFFFFF">Free BORe Diagnostic. Your structure in minutes.</text>
<text x="68.5" y="1105.7" font-size="29.9" fill="#F3DDB4">Link in the comment section below.</text>
<rect x="0" y="1165.7" width="1028.5" height="120" fill="#FFFFFF"/>
<image x="68.5" y="1177.7" width="380" height="86" href="data:image/png;base64,"/>
<text x="959.9" y="1223.7" font-size="24" font-weight="bold" fill="#14302A" text-anchor="end">Tony Taslim | Founder</text>
</svg>
