<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 981.8 1227.2">
<title>The 1-page decision record</title>
<style>text{font-family:Arial,Helvetica,"Liberation Sans",sans-serif}</style>
<rect x="0" y="0" width="981.8" height="1227.2" fill="#F6F2E8"/>
<rect x="0" y="0" width="981.8" height="14" fill="#B8741A"/>
<text x="65.4" y="92" font-size="22" font-weight="bold" fill="#B8741A">THE ENTERPRISE ARCHITECT GAP</text>
<text x="65.4" y="150" font-size="60" font-weight="bold" fill="#14302A">The 1-page decision record</text>
<text x="65.4" y="223.2" font-size="28" fill="#4A5A55">Ten minutes per decision. The reasoning outlasts the person.</text>
<rect x="65.4" y="287.5" width="850.9" height="122.6" rx="18" fill="#FFFFFF" stroke="#D8D2BF" stroke-width="2"/>
<circle cx="117.4" cy="348.9" r="30" fill="#10705A"/>
<text x="117.4" y="360.9" font-size="34" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="177.4" y="345.5" font-size="34" font-weight="bold" fill="#14302A">Decision and why now</text>
<text x="177.4" y="382.9" font-size="26" fill="#4A5A55">One sentence on the choice and the problem it solves.</text>
<rect x="65.4" y="424.1" width="850.9" height="122.6" rx="18" fill="#FFFFFF" stroke="#D8D2BF" stroke-width="2"/>
<circle cx="117.4" cy="485.4" r="30" fill="#10705A"/>
<text x="117.4" y="497.4" font-size="34" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="177.4" y="482.1" font-size="34" font-weight="bold" fill="#14302A">Options considered</text>
<text x="177.4" y="519.5" font-size="26" fill="#4A5A55">At least three, including doing nothing.</text>
<rect x="65.4" y="560.8" width="850.9" height="122.6" rx="18" fill="#FFFFFF" stroke="#D8D2BF" stroke-width="2"/>
<circle cx="117.4" cy="622" r="30" fill="#10705A"/>
<text x="117.4" y="634" font-size="34" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="177.4" y="618.8" font-size="34" font-weight="bold" fill="#14302A">Fit check</text>
<text x="177.4" y="656.1" font-size="26" fill="#4A5A55">Touches on people, process, technology and risk.</text>
<rect x="65.4" y="697.4" width="850.9" height="122.6" rx="18" fill="#FFFFFF" stroke="#D8D2BF" stroke-width="2"/>
<circle cx="117.4" cy="758.6" r="30" fill="#10705A"/>
<text x="117.4" y="770.6" font-size="34" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="177.4" y="755.4" font-size="34" font-weight="bold" fill="#14302A">Cost and ROI</text>
<text x="177.4" y="792.8" font-size="26" fill="#4A5A55">Time saved or margin protected.</text>
<rect x="65.4" y="834" width="850.9" height="122.6" rx="18" fill="#FFFFFF" stroke="#D8D2BF" stroke-width="2"/>
<circle cx="117.4" cy="895.3" r="30" fill="#10705A"/>
<text x="117.4" y="907.3" font-size="34" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="177.4" y="892" font-size="34" font-weight="bold" fill="#14302A">Owner and review date</text>
<text x="177.4" y="929.4" font-size="26" fill="#4A5A55">One named person. A date to check it was right.</text>
<rect x="65.4" y="974.6" width="850.9" height="76.4" rx="18" fill="#E1EEE8"/>
<text x="95.4" y="1014.6" font-size="28" font-weight="bold" fill="#10705A">Start with your next tool purchase or hire.</text>
<rect x="0" y="1107.2" width="981.8" height="120" fill="#FFFFFF"/>
<polygon points="123.4,1155.1 123.4,1159.5 116.7,1162.4 115.6,1165.6 119.3,1171.9 116.7,1175.5 109.6,1173.9 106.9,1175.9 106.2,1183.1 102,1184.5 97.2,1179 93.7,1179 88.9,1184.5 84.7,1183.1 84,1175.9 81.3,1173.9 74.2,1175.5 71.6,1171.9 75.3,1165.6 74.2,1162.4 67.5,1159.5 67.5,1155.1 74.2,1152.2 75.3,1148.9 71.6,1142.6 74.2,1139.1 81.3,1140.7 84,1138.7 84.7,1131.4 88.9,1130 93.7,1135.5 97.2,1135.5 102,1130 106.2,1131.4 106.9,1138.7 109.6,1140.7 116.7,1139.1 119.3,1142.6 115.6,1148.9 116.7,1152.2" fill="#10705A"/>
<circle cx="95.4" cy="1157.2" r="11.7" fill="#F6F2E8"/>
<text x="139.4" y="1149.2" font-size="30" font-weight="bold" fill="#14302A">Tony Taslim</text>
<text x="139.4" y="1181.2" font-size="22" fill="#4A5A55">Efficient Business Solutions</text>
<text x="916.3" y="1203.2" font-size="20" fill="#B8741A" text-anchor="end" font-style="italic">Enterprise structure, translated.</text>
</svg>
