<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 981.8 1227.2">
<title>Insurance pays after. Structure acts before.</title>
<style>text{font-family:Arial,Helvetica,"Liberation Sans",sans-serif}</style>
<rect x="0" y="0" width="981.8" height="1227.2" fill="#F6F2E8"/>
<rect x="0" y="0" width="981.8" height="14" fill="#B8741A"/>
<text x="65.4" y="92" font-size="22" font-weight="bold" fill="#B8741A">RESILIENCE OVER GROWTH</text>
<text x="65.4" y="150" font-size="60" font-weight="bold" fill="#14302A">Insurance pays after.</text>
<text x="65.4" y="217.2" font-size="60" font-weight="bold" fill="#14302A">Structure acts before.</text>
<text x="65.4" y="290.4" font-size="28" fill="#4A5A55">Keep the policy. Then build the first hour.</text>
<rect x="65.4" y="354.7" width="410.4" height="70" rx="14" fill="#4A5A55"/>
<text x="270.6" y="400.7" font-size="32" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Insurance</text>
<rect x="505.9" y="354.7" width="410.4" height="70" rx="14" fill="#10705A"/>
<text x="711.1" y="400.7" font-size="32" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Structure</text>
<rect x="65.4" y="444.7" width="410.4" height="72.4" rx="14" fill="#FFFFFF" stroke="#D8D2BF" stroke-width="2"/>
<text x="87.4" y="484.7" font-size="28" fill="#4A5A55">Responds after the event</text>
<rect x="505.9" y="444.7" width="410.4" height="72.4" rx="14" fill="#E1EEE8" stroke="#10705A" stroke-width="2"/>
<text x="527.9" y="484.7" font-size="28" font-weight="bold" fill="#14302A">Shapes whether it happens</text>
<rect x="65.4" y="531.1" width="410.4" height="72.4" rx="14" fill="#FFFFFF" stroke="#D8D2BF" stroke-width="2"/>
<text x="87.4" y="571.1" font-size="28" fill="#4A5A55">Helps with the repair bill</text>
<rect x="505.9" y="531.1" width="410.4" height="72.4" rx="14" fill="#E1EEE8" stroke="#10705A" stroke-width="2"/>
<text x="527.9" y="571.1" font-size="28" font-weight="bold" fill="#14302A">Limits how big it gets</text>
<rect x="65.4" y="617.5" width="410.4" height="72.4" rx="14" fill="#FFFFFF" stroke="#D8D2BF" stroke-width="2"/>
<text x="87.4" y="657.5" font-size="28" fill="#4A5A55">Cannot return lost momentum</text>
<rect x="505.9" y="617.5" width="410.4" height="72.4" rx="14" fill="#E1EEE8" stroke="#10705A" stroke-width="2"/>
<text x="527.9" y="657.5" font-size="28" font-weight="bold" fill="#14302A">Brings you back faster</text>
<rect x="65.4" y="703.9" width="410.4" height="108.8" rx="14" fill="#FFFFFF" stroke="#D8D2BF" stroke-width="2"/>
<text x="87.4" y="743.9" font-size="28" fill="#4A5A55">Answers: who pays?</text>
<rect x="505.9" y="703.9" width="410.4" height="108.8" rx="14" fill="#E1EEE8" stroke="#10705A" stroke-width="2"/>
<text x="527.9" y="743.9" font-size="28" font-weight="bold" fill="#14302A">Answers: what do we do</text>
<text x="527.9" y="780.3" font-size="28" font-weight="bold" fill="#14302A">first?</text>
<rect x="65.4" y="830.7" width="850.9" height="112.8" rx="18" fill="#EBE3D0"/>
<text x="95.4" y="870.7" font-size="28" font-weight="bold" fill="#14302A">Ask: if our key system stopped tonight, what would we do</text>
<text x="95.4" y="907.1" font-size="28" font-weight="bold" fill="#14302A">in the first hour?</text>
<rect x="0" y="1107.2" width="981.8" height="120" fill="#FFFFFF"/>
