<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<title>Learn how to learn</title>
<style>text{font-family:Arial,Helvetica,"Liberation Sans",sans-serif}</style>
<rect x="0" y="0" width="1080" height="1350" fill="#F6F2E8"/>
<rect x="0" y="0" width="1080" height="14" fill="#B8741A"/>
<text x="72" y="92" font-size="22" font-weight="bold" fill="#B8741A">LESSONS FROM THE FIELD</text>
<text x="72" y="150" font-size="60" font-weight="bold" fill="#14302A">Learn how to learn</text>
<text x="72" y="223.2" font-size="28" fill="#4A5A55">The Saturday lesson behind every structure I read.</text>
<rect x="72" y="291.5" width="936" height="330" rx="24" fill="#14302A"/>
<text x="112" y="431.5" font-size="200" font-weight="bold" fill="#B8741A">"</text>
<text x="202" y="391.5" font-size="46" font-weight="bold" fill="#FFFFFF">He never handed us the answer.</text>
<text x="202" y="446.7" font-size="46" font-weight="bold" fill="#FFFFFF">He said, go and find out.</text>
<text x="202" y="520" font-size="26" fill="#CFE0DA">A young teacher, a school computer room, and a mentor until</text>
<text x="202" y="553.8" font-size="26" fill="#CFE0DA">around 2010.</text>
<text x="72" y="683.5" font-size="30" font-weight="bold" fill="#10705A">The curiosity loop I still use in every firm</text>
<rect x="72" y="709.5" width="298.6" height="360" rx="18" fill="#FFFFFF" stroke="#D8D2BF" stroke-width="2"/>
<circle cx="122" cy="767.5" r="32" fill="#10705A"/>
<text x="122" y="779.5" font-size="34" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="166" y="777.5" font-size="26" font-weight="bold" fill="#14302A">Ask</text>
<text x="96" y="849.5" font-size="26" fill="#4A5A55">Get curious about the</text>
<text x="96" y="883.3" font-size="26" fill="#4A5A55">people, the process</text>
<text x="96" y="917.1" font-size="26" fill="#4A5A55">and the technology.</text>
<rect x="390.6" y="709.5" width="298.6" height="360" rx="18" fill="#FFFFFF" stroke="#D8D2BF" stroke-width="2"/>
<circle cx="440.6" cy="767.5" r="32" fill="#10705A"/>
<text x="440.6" y="779.5" font-size="34" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="484.6" y="777.5" font-size="26" font-weight="bold" fill="#14302A">Find</text>
<text x="414.6" y="849.5" font-size="26" fill="#4A5A55">Look it up, test it, and</text>
<text x="414.6" y="883.3" font-size="26" fill="#4A5A55">keep digging until</text>
<text x="414.6" y="917.1" font-size="26" fill="#4A5A55">you see the whole</text>
<text x="414.6" y="950.9" font-size="26" fill="#4A5A55">picture.</text>
<rect x="709.3" y="709.5" width="298.6" height="360" rx="18" fill="#FFFFFF" stroke="#D8D2BF" stroke-width="2"/>
<circle cx="759.3" cy="767.5" r="32" fill="#10705A"/>
<text x="759.3" y="779.5" font-size="34" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="803.3" y="777.5" font-size="26" font-weight="bold" fill="#14302A">Make it work</text>
<text x="733.3" y="849.5" font-size="26" fill="#4A5A55">Keep going until the</text>
<text x="733.3" y="883.3" font-size="26" fill="#4A5A55">answer works for the</text>
<text x="733.3" y="917.1" font-size="26" fill="#4A5A55">business in front of</text>
<text x="733.3" y="950.9" font-size="26" fill="#4A5A55">you.</text>
<rect x="72" y="1093.6" width="936" height="76.4" rx="18" fill="#E1EEE8"/>
<text x="102" y="1133.6" font-size="28" font-weight="bold" fill="#10705A">Step by step, curiosity compounds like interest.</text>
<rect x="0" y="1230" width="1080" height="120" fill="#FFFFFF"/>
<image x="72" y="1238" width="360" height="98" href="data:image/png;base64,"/>
<text x="1008" y="1290" font-size="22" font-weight="bold" fill="#10705A" text-anchor="end">Efficient Business Solutions</text>
</svg>
