<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 939.1 1173.9">
<title>Brief. Work. Debrief.</title>
<style>text{font-family:Arial,Helvetica,"Liberation Sans",sans-serif}</style>
<rect x="0" y="0" width="939.1" height="1173.9" fill="#F6F2E8"/>
<rect x="0" y="0" width="939.1" height="14" fill="#B8741A"/>
<text x="62.6" y="92" font-size="22" font-weight="bold" fill="#B8741A">LESSONS FROM THE FIELD</text>
<text x="62.6" y="150" font-size="60" font-weight="bold" fill="#14302A">Brief. Work. Debrief.</text>
<text x="62.6" y="223.2" font-size="28" fill="#4A5A55">A habit that started with a school bus and still runs my days.</text>
<rect x="62.6" y="287.5" width="391.9" height="520" rx="20" fill="#FFFFFF" stroke="#10705A" stroke-width="4"/>
<rect x="62.6" y="287.5" width="391.9" height="90" rx="20" fill="#10705A"/>
<rect x="62.6" y="337.5" width="391.9" height="40" fill="#10705A"/>
<text x="90.6" y="347.5" font-size="34" font-weight="bold" fill="#FFFFFF">Morning brief</text>
<text x="90.6" y="421.5" font-size="24" font-weight="bold" fill="#B8741A">Prepare for the expected</text>
<circle cx="98.6" cy="473.5" r="7" fill="#10705A"/>
<text x="118.6" y="481.5" font-size="26" fill="#14302A">Name the top three for</text>
<text x="118.6" y="514" font-size="26" fill="#14302A">today</text>
<circle cx="98.6" cy="556.5" r="7" fill="#10705A"/>
<text x="118.6" y="564.5" font-size="26" fill="#14302A">Share them with your</text>
<text x="118.6" y="597" font-size="26" fill="#14302A">team</text>
<circle cx="98.6" cy="639.5" r="7" fill="#10705A"/>
<text x="118.6" y="647.5" font-size="26" fill="#14302A">Prepare the night before</text>
<circle cx="98.6" cy="690" r="7" fill="#10705A"/>
<text x="118.6" y="698" font-size="26" fill="#14302A">Know what could surprise</text>
<text x="118.6" y="730.5" font-size="26" fill="#14302A">you</text>
<rect x="484.5" y="287.5" width="391.9" height="520" rx="20" fill="#FFFFFF" stroke="#B8741A" stroke-width="4"/>
<rect x="484.5" y="287.5" width="391.9" height="90" rx="20" fill="#B8741A"/>
<rect x="484.5" y="337.5" width="391.9" height="40" fill="#B8741A"/>
<text x="512.5" y="347.5" font-size="34" font-weight="bold" fill="#FFFFFF">Evening debrief</text>
<text x="512.5" y="421.5" font-size="24" font-weight="bold" fill="#B8741A">Learn, then reset</text>
<circle cx="520.5" cy="473.5" r="7" fill="#B8741A"/>
<text x="540.5" y="481.5" font-size="26" fill="#14302A">What went well, first</text>
<circle cx="520.5" cy="524" r="7" fill="#B8741A"/>
<text x="540.5" y="532" font-size="26" fill="#14302A">What could go better</text>
<circle cx="520.5" cy="574.5" r="7" fill="#B8741A"/>
<text x="540.5" y="582.5" font-size="26" fill="#14302A">What must be ready</text>
<text x="540.5" y="615" font-size="26" fill="#14302A">tomorrow</text>
<circle cx="520.5" cy="657.5" r="7" fill="#B8741A"/>
<text x="540.5" y="665.5" font-size="26" fill="#14302A">Capture one lesson</text>
<rect x="62.6" y="827.5" width="813.9" height="150" rx="20" fill="#14302A"/>
<text x="92.6" y="881.5" font-size="30" font-weight="bold" fill="#FFFFFF">Handle the unexpected without drowning in the</text>
<text x="92.6" y="920.5" font-size="30" font-weight="bold" fill="#FFFFFF">expected.</text>
<rect x="0" y="1053.9" width="939.1" height="120" fill="#FFFFFF"/>
<image x="62.6" y="1061.9" width="360" height="98" href="data:image/png;base64,"/>
<text x="876.5" y="1113.9" font-size="22" font-weight="bold" fill="#10705A" text-anchor="end">Efficient Business Solutions</text>
</svg>
