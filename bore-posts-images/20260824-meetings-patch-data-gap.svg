<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<title>5 signs your meetings are patching a data gap</title>
<style>text{font-family:Arial,Helvetica,"Liberation Sans",sans-serif}</style>
<rect x="0" y="0" width="1080" height="1350" fill="#F6F2E8"/>
<rect x="0" y="0" width="1080" height="14" fill="#B8741A"/>
<text x="72" y="92" font-size="22" font-weight="bold" fill="#B8741A">FRAGILITY AS COMMERCIAL RISK</text>
<text x="72" y="150" font-size="60" font-weight="bold" fill="#14302A">5 signs your meetings are</text>
<text x="72" y="217.2" font-size="60" font-weight="bold" fill="#14302A">patching a data gap</text>
<text x="72" y="290.4" font-size="28" fill="#4A5A55">Tick what you recognise. Save it for your next leadership meeting.</text>
<rect x="72" y="354.7" width="936" height="122.6" rx="18" fill="#FFFFFF" stroke="#D8D2BF" stroke-width="2"/>
<circle cx="124" cy="416" r="30" fill="#10705A"/>
<text x="124" y="428" font-size="34" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="184" y="412.7" font-size="34" font-weight="bold" fill="#14302A">Updates given twice</text>
<text x="184" y="450.1" font-size="26" fill="#4A5A55">Once to the team, again to the leadership group.</text>
<rect x="72" y="491.4" width="936" height="122.6" rx="18" fill="#FFFFFF" stroke="#D8D2BF" stroke-width="2"/>
<circle cx="124" cy="552.6" r="30" fill="#10705A"/>
<text x="124" y="564.6" font-size="34" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="184" y="549.4" font-size="34" font-weight="bold" fill="#14302A">Version debates</text>
<text x="184" y="586.8" font-size="26" fill="#4A5A55">Meetings open with "which report are we using?"</text>
<rect x="72" y="628" width="936" height="122.6" rx="18" fill="#FFFFFF" stroke="#D8D2BF" stroke-width="2"/>
<circle cx="124" cy="689.3" r="30" fill="#10705A"/>
<text x="124" y="701.3" font-size="34" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="184" y="686" font-size="34" font-weight="bold" fill="#14302A">Decisions wait</text>
<text x="184" y="723.4" font-size="26" fill="#4A5A55">Nobody trusts the live figure, so it waits for the next meeting.</text>
<rect x="72" y="764.6" width="936" height="122.6" rx="18" fill="#FFFFFF" stroke="#D8D2BF" stroke-width="2"/>
<circle cx="124" cy="825.9" r="30" fill="#10705A"/>
<text x="124" y="837.9" font-size="34" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="184" y="822.6" font-size="34" font-weight="bold" fill="#14302A">One person invited to everything</text>
<text x="184" y="860" font-size="26" fill="#4A5A55">They hold context nobody wrote down.</text>
<rect x="72" y="901.2" width="936" height="122.6" rx="18" fill="#FFFFFF" stroke="#D8D2BF" stroke-width="2"/>
<circle cx="124" cy="962.5" r="30" fill="#10705A"/>
<text x="124" y="974.5" font-size="34" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="184" y="959.2" font-size="34" font-weight="bold" fill="#14302A">Actions get re-discussed</text>
<text x="184" y="996.6" font-size="26" fill="#4A5A55">Nobody can see last week's status.</text>
<rect x="72" y="1041.8" width="936" height="112.8" rx="18" fill="#E1EEE8"/>
<text x="102" y="1081.8" font-size="28" font-weight="bold" fill="#10705A">Score: 0 to 1 healthy. 2 watch. 3 or more means a connected</text>
<text x="102" y="1118.2" font-size="28" font-weight="bold" fill="#10705A">system can give your people hours back.</text>
<rect x="0" y="1230" width="1080" height="120" fill="#FFFFFF"/>
<polygon points="129.9,1277.8 129.9,1282.2 123.2,1285.1 122.2,1288.4 125.9,1294.6 123.3,1298.2 116.2,1296.6 113.4,1298.6 112.7,1305.9 108.5,1307.2 103.7,1301.8 100.3,1301.8 95.5,1307.2 91.3,1305.9 90.6,1298.6 87.8,1296.6 80.7,1298.2 78.1,1294.6 81.8,1288.4 80.8,1285.1 74.1,1282.2 74.1,1277.8 80.8,1274.9 81.8,1271.6 78.1,1265.4 80.7,1261.8 87.8,1263.4 90.6,1261.4 91.3,1254.1 95.5,1252.8 100.3,1258.2 103.7,1258.2 108.5,1252.8 112.7,1254.1 113.4,1261.4 116.2,1263.4 123.3,1261.8 125.9,1265.4 122.2,1271.6 123.2,1274.9" fill="#10705A"/>
<circle cx="102" cy="1280" r="11.7" fill="#F6F2E8"/>
<text x="146" y="1272" font-size="30" font-weight="bold" fill="#14302A">Tony Taslim</text>
<text x="146" y="1304" font-size="22" fill="#4A5A55">Efficient Business Solutions</text>
<text x="1008" y="1326" font-size="20" fill="#B8741A" text-anchor="end" font-style="italic">Enterprise structure, translated.</text>
</svg>
