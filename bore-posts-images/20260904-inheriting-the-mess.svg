<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<title>Get it out of one head and onto one page</title>
<style>text{font-family:Arial,Helvetica,"Liberation Sans",sans-serif}</style>
<rect x="0" y="0" width="1080" height="1350" fill="#F6F2E8"/>
<rect x="0" y="0" width="1080" height="14" fill="#B8741A"/>
<text x="72" y="92" font-size="22" font-weight="bold" fill="#B8741A">FRAGILITY AS COMMERCIAL RISK</text>
<text x="72" y="150" font-size="60" font-weight="bold" fill="#14302A">Get it out of one head and onto</text>
<text x="72" y="217.2" font-size="60" font-weight="bold" fill="#14302A">one page</text>
<text x="72" y="290.4" font-size="28" fill="#4A5A55">Do it while the expert is happy and still in the building.</text>
<rect x="72" y="354.7" width="428" height="360" rx="20" fill="#EBE3D0"/>
<text x="286" y="404.7" font-size="34" font-weight="bold" fill="#14302A" text-anchor="middle">In one head</text>
<text x="100" y="448.7" font-size="26" fill="#4A5A55">Why each client step happens</text>
<text x="100" y="495.2" font-size="26" fill="#4A5A55">Who to call when it breaks</text>
<text x="100" y="541.8" font-size="26" fill="#4A5A55">Where the files really live</text>
<text x="100" y="588.3" font-size="26" fill="#4A5A55">The workarounds nobody told</text>
<text x="100" y="620.8" font-size="26" fill="#4A5A55">you</text>
<text x="540" y="548.8" font-size="60" font-weight="bold" fill="#B8741A" text-anchor="middle">&gt;</text>
<rect x="580" y="354.7" width="428" height="360" rx="20" fill="#E1EEE8" stroke="#10705A" stroke-width="3"/>
<text x="794" y="404.7" font-size="34" font-weight="bold" fill="#10705A" text-anchor="middle">On one page</text>
<text x="608" y="448.7" font-size="26" font-weight="bold" fill="#14302A">Steps in order</text>
<text x="608" y="495.2" font-size="26" font-weight="bold" fill="#14302A">Contacts and owners</text>
<text x="608" y="541.8" font-size="26" font-weight="bold" fill="#14302A">File locations</text>
<text x="608" y="588.3" font-size="26" font-weight="bold" fill="#14302A">Known issues and fixes</text>
<rect x="72" y="744.8" width="936" height="122.6" rx="18" fill="#FFFFFF" stroke="#D8D2BF" stroke-width="2"/>
<circle cx="124" cy="806" r="30" fill="#10705A"/>
<text x="124" y="818" font-size="34" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="184" y="802.8" font-size="34" font-weight="bold" fill="#14302A">Pick one process</text>
<text x="184" y="840.1" font-size="26" fill="#4A5A55">Only one person fully understands it.</text>
<rect x="72" y="881.4" width="936" height="122.6" rx="18" fill="#FFFFFF" stroke="#D8D2BF" stroke-width="2"/>
<circle cx="124" cy="942.6" r="30" fill="#10705A"/>
<text x="124" y="954.6" font-size="34" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="184" y="939.4" font-size="34" font-weight="bold" fill="#14302A">Walk it through</text>
<text x="184" y="976.8" font-size="26" fill="#4A5A55">Expert talks, a colleague writes.</text>
<rect x="72" y="1018" width="936" height="122.6" rx="18" fill="#FFFFFF" stroke="#D8D2BF" stroke-width="2"/>
<circle cx="124" cy="1079.3" r="30" fill="#10705A"/>
<text x="124" y="1091.3" font-size="34" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="184" y="1076" font-size="34" font-weight="bold" fill="#14302A">Review in a month</text>
<text x="184" y="1113.4" font-size="26" fill="#4A5A55">Check it works for someone new.</text>
<rect x="0" y="1230" width="1080" height="120" fill="#FFFFFF"/>
<image x="72" y="1238" width="360" height="98" href="data:image/png;base64,"/>
<text x="1008" y="1290" font-size="22" font-weight="bold" fill="#10705A" text-anchor="end">Efficient Business Solutions</text>
</svg>
