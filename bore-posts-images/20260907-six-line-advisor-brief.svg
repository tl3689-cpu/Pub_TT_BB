<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1028.5 1285.7">
<title>The 6-line advisor brief</title>
<style>text{font-family:Arial,Helvetica,"Liberation Sans",sans-serif}</style>
<rect x="0" y="0" width="1028.5" height="1285.7" fill="#F6F2E8"/>
<rect x="0" y="0" width="1028.5" height="14" fill="#B8741A"/>
<text x="68.5" y="92" font-size="22" font-weight="bold" fill="#B8741A">THE ENTERPRISE ARCHITECT GAP</text>
<text x="68.5" y="150" font-size="60" font-weight="bold" fill="#14302A">The 6-line advisor brief</text>
<text x="68.5" y="223.2" font-size="28" fill="#4A5A55">Send the same brief to every advisor. Compare their answers.</text>
<rect x="68.5" y="287.5" width="891.4" height="122.6" rx="18" fill="#FFFFFF" stroke="#D8D2BF" stroke-width="2"/>
<circle cx="120.5" cy="348.9" r="30" fill="#10705A"/>
<text x="120.5" y="360.9" font-size="34" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="180.5" y="345.5" font-size="34" font-weight="bold" fill="#14302A">The outcome</text>
<text x="180.5" y="382.9" font-size="26" fill="#4A5A55">What the business can do in 12 months that it cannot now.</text>
<rect x="68.5" y="424.1" width="891.4" height="122.6" rx="18" fill="#FFFFFF" stroke="#D8D2BF" stroke-width="2"/>
<circle cx="120.5" cy="485.4" r="30" fill="#10705A"/>
<text x="120.5" y="497.4" font-size="34" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="180.5" y="482.1" font-size="34" font-weight="bold" fill="#14302A">The map</text>
<text x="180.5" y="519.5" font-size="26" fill="#4A5A55">Main systems and who uses each one.</text>
<rect x="68.5" y="560.8" width="891.4" height="122.6" rx="18" fill="#FFFFFF" stroke="#D8D2BF" stroke-width="2"/>
<circle cx="120.5" cy="622" r="30" fill="#10705A"/>
<text x="120.5" y="634" font-size="34" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="180.5" y="618.8" font-size="34" font-weight="bold" fill="#14302A">The dependencies</text>
<text x="180.5" y="656.1" font-size="26" fill="#4A5A55">People and systems you cannot run without.</text>
<rect x="68.5" y="697.4" width="891.4" height="122.6" rx="18" fill="#FFFFFF" stroke="#D8D2BF" stroke-width="2"/>
<circle cx="120.5" cy="758.6" r="30" fill="#10705A"/>
<text x="120.5" y="770.6" font-size="34" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="180.5" y="755.4" font-size="34" font-weight="bold" fill="#14302A">The history</text>
<text x="180.5" y="792.8" font-size="26" fill="#4A5A55">What you tried, what worked, what did not stick.</text>
<rect x="68.5" y="834" width="891.4" height="122.6" rx="18" fill="#FFFFFF" stroke="#D8D2BF" stroke-width="2"/>
<circle cx="120.5" cy="895.3" r="30" fill="#10705A"/>
<text x="120.5" y="907.3" font-size="34" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="180.5" y="892" font-size="34" font-weight="bold" fill="#14302A">The limits</text>
<text x="180.5" y="929.4" font-size="26" fill="#4A5A55">Budget, timing and what the board ruled out.</text>
<rect x="68.5" y="970.6" width="891.4" height="122.6" rx="18" fill="#FFFFFF" stroke="#D8D2BF" stroke-width="2"/>
<circle cx="120.5" cy="1031.9" r="30" fill="#10705A"/>
<text x="120.5" y="1043.9" font-size="34" font-weight="bold" fill="#FFFFFF" text-anchor="middle">6</text>
<text x="180.5" y="1028.6" font-size="34" font-weight="bold" fill="#14302A">The test</text>
<text x="180.5" y="1066" font-size="26" fill="#4A5A55">How success is measured, in numbers or hours.</text>
<rect x="0" y="1165.7" width="1028.5" height="120" fill="#FFFFFF"/>
<polygon points="126.5,1213.5 126.5,1217.9 119.8,1220.8 118.7,1224.1 122.4,1230.3 119.9,1233.9 112.8,1232.3 110,1234.3 109.3,1241.6 105.1,1242.9 100.3,1237.5 96.9,1237.5 92,1242.9 87.9,1241.6 87.2,1234.3 84.4,1232.3 77.3,1233.9 74.7,1230.3 78.4,1224.1 77.3,1220.8 70.7,1217.9 70.7,1213.5 77.3,1210.6 78.4,1207.4 74.7,1201.1 77.3,1197.5 84.4,1199.1 87.2,1197.1 87.9,1189.8 92,1188.5 96.9,1193.9 100.3,1193.9 105.1,1188.5 109.3,1189.8 110,1197.1 112.8,1199.1 119.9,1197.5 122.4,1201.1 118.7,1207.4 119.8,1210.6" fill="#10705A"/>
<circle cx="98.5" cy="1215.7" r="11.7" fill="#F6F2E8"/>
<text x="142.5" y="1207.7" font-size="30" font-weight="bold" fill="#14302A">Tony Taslim</text>
<text x="142.5" y="1239.7" font-size="22" fill="#4A5A55">Efficient Business Solutions</text>
<text x="959.9" y="1261.7" font-size="20" fill="#B8741A" text-anchor="end" font-style="italic">Enterprise structure, translated.</text>
</svg>
